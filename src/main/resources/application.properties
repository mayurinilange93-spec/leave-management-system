# --- Application ---
spring.application.name=leave-management-system
server.port=8080

# --- MySQL connection ---
# Change the database name, username, and password below to match your setup.
# Create the database first, e.g.:  CREATE DATABASE leave_management_db;
spring.datasource.url=jdbc:mysql://localhost:3306/leave_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=maya@1009
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# "update" will auto-create/alter tables based on your entity classes.
# Great for learning; for production use a migration tool like Flyway instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
